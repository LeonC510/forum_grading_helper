name: CI

# Tests on every pull request (the gate before merging) and on direct pushes
# to main. Deploying happens only when a PR is merged — see release.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
