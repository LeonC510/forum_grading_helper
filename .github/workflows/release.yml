name: Deploy to Chrome Web Store

# Runs when a pull request is merged into main (direct pushes to main never
# deploy). It checks out the merge commit, runs the tests, asks the Web Store
# which version it currently holds, and — if the manifest is newer — zips
# extension/, uploads it and submits it for review. A manual run from the
# Actions tab does the same for the current main (with an optional publish,
# handy while an earlier submission is still under review).
#
# Note: pull requests opened from forks do not receive repository secrets, so
# deploys must come from branches in this repository.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Submit for review after uploading (off = upload only)'
        type: boolean
        default: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the merge produced on main (merge, squash or rebase).
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check store credentials are configured
        run: |
          for v in EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret CWS_$v — see docs/RELEASING.md"; exit 1; fi
          done

      - name: Is the manifest newer than what the store has?
        id: version
        run: |
          CURRENT=$(node -p "require('./extension/manifest.json').version")
          STORE=$(node scripts/cws-version.js)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          if node -e "process.exit(require('./scripts/cws-version.js').isNewer('$CURRENT', '$STORE' === 'none' ? null : '$STORE') ? 0 : 1)"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "store has $STORE, manifest is $CURRENT: deploying"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::store already has $STORE and the manifest is $CURRENT — nothing to deploy (bump extension/manifest.json to release)"
          fi

      - name: Zip the extension
        if: steps.version.outputs.deploy == 'true'
        run: |
          cd extension
          zip -r "../forum-grading-helper-${{ steps.version.outputs.version }}.zip" . -x '.DS_Store' '*/.DS_Store'
          cd ..
          unzip -l "forum-grading-helper-${{ steps.version.outputs.version }}.zip"

      - name: Keep the zip as a build artifact
        if: steps.version.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forum-grading-helper-${{ steps.version.outputs.version }}
          path: forum-grading-helper-${{ steps.version.outputs.version }}.zip

      - name: Upload to the Chrome Web Store
        if: steps.version.outputs.deploy == 'true'
        run: npx --yes chrome-webstore-upload-cli@3 upload --source "forum-grading-helper-${{ steps.version.outputs.version }}.zip"

      - name: Submit for review (publish)
        if: steps.version.outputs.deploy == 'true' && (github.event_name == 'pull_request' || inputs.publish)
        run: npx --yes chrome-webstore-upload-cli@3 publish
