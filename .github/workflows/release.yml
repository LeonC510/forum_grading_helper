name: Deploy to Chrome Web Store

# Every push to main (i.e. every merged PR) runs the tests. If the merge
# bumped "version" in extension/manifest.json, the extension is also zipped,
# uploaded to the Chrome Web Store and submitted for review. A manual run
# from the Actions tab always uploads (and publishes unless switched off —
# handy while an earlier submission is still under review).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Submit for review after uploading (off = upload only)'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD and its parent(s): needed to see the previous manifest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Did this merge bump the version?
        id: version
        run: |
          CURRENT=$(node -p "require('./extension/manifest.json').version")
          PREVIOUS=$(git show HEAD^:extension/manifest.json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch(e){'none'}")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "manifest version $PREVIOUS -> $CURRENT: deploying"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "manifest version unchanged ($CURRENT): tests only, nothing uploaded"
          fi

      - name: Zip the extension
        if: steps.version.outputs.deploy == 'true'
        run: |
          cd extension
          zip -r "../forum-grading-helper-${{ steps.version.outputs.version }}.zip" . -x '.DS_Store' '*/.DS_Store'
          cd ..
          unzip -l "forum-grading-helper-${{ steps.version.outputs.version }}.zip"

      - name: Keep the zip as a build artifact
        if: steps.version.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forum-grading-helper-${{ steps.version.outputs.version }}
          path: forum-grading-helper-${{ steps.version.outputs.version }}.zip

      - name: Check store credentials are configured
        if: steps.version.outputs.deploy == 'true'
        run: |
          for v in EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret CWS_$v — see docs/RELEASING.md"; exit 1; fi
          done

      - name: Upload to the Chrome Web Store
        if: steps.version.outputs.deploy == 'true'
        run: npx --yes chrome-webstore-upload-cli@3 upload --source "forum-grading-helper-${{ steps.version.outputs.version }}.zip"

      - name: Submit for review (publish)
        if: steps.version.outputs.deploy == 'true' && (github.event_name == 'push' || inputs.publish)
        run: npx --yes chrome-webstore-upload-cli@3 publish
