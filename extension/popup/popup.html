<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forum Grading Helper</title>
  <style>
    body { margin: 0; padding: 12px 14px; min-width: 220px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #222; }
    h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
    .version { color: #666; }
    ul { margin: 10px 0 0; padding-left: 16px; color: #444; }
    li { margin: 2px 0; }
  </style>
</head>
<body>
  <h1 id="name">Forum Grading Helper</h1>
  <div class="version">Version <span id="version">…</span></div>
  <ul>
    <li>Random, persistent student order per class session / assignment</li>
    <li>"Shuffle Order" next to <em>Who</em> in the grader sidebar</li>
    <li>"Blind Assess Class" / "Blind Grade Assignment" by default</li>
  </ul>
  <script src="popup.js"></script>
</body>
</html>
